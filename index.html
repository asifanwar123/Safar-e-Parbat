
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Safar-e-Parbat | Pakistan Tourism</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0fdf4',
                100: '#dcfce7',
                500: '#22c55e',
                600: '#16a34a',
                700: '#15803d',
                800: '#166534',
                900: '#14532d', // Pakistan Green-ish
              },
              accent: {
                500: '#f59e0b', // Amber/Gold
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              urdu: ['"Noto Nastaliq Urdu"', 'serif'],
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'float-slow': 'float 8s ease-in-out infinite',
              'float-delayed': 'float 7s ease-in-out 3s infinite',
              'fade-in': 'fadeIn 0.5s ease-out',
              'scale-up': 'scaleUp 0.3s ease-out',
              'fade-in-up': 'fadeInUp 0.8s ease-out',
              'spin-slow': 'spin 3s linear infinite',
              'scroll': 'scroll 40s linear infinite',
              'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              scaleUp: {
                 '0%': { opacity: '0.5', transform: 'scale(0.9)' },
                 '100%': { opacity: '1', transform: 'scale(1)' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              scroll: {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              shake: {
                '10%, 90%': { transform: 'translateX(-1px)' },
                '20%, 80%': { transform: 'translateX(2px)' },
                '30%, 50%, 70%': { transform: 'translateX(-4px)' },
                '40%, 60%': { transform: 'translateX(4px)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #166534;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #14532d;
      }
      .font-urdu {
        line-height: 2.0 !important; /* Nastaliq needs more height */
      }
    </style>

  }
}
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {

        .catch(err => console.error('Service Worker registration failed:', err));
    });
  }
</script>
